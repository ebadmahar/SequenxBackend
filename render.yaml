services:
  - type: web
    name: hisequenx
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://sequenxx.ebadmahar.site,https://hisequenx.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: FRONTEND_URL
        value: "https://sequenxx.ebadmahar.site"
