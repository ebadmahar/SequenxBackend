<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Contact Inquiry Received</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f7fafc; margin: 0; padding: 24px; color: #2d3748; }
    .card { background-color: #ffffff; max-width: 600px; margin: 0 auto; border-radius: 8px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0; }
    h2 { color: #1a202c; margin-top: 0; font-size: 22px; border-bottom: 2px solid #edf2f7; padding-bottom: 12px; }
    .field { margin-bottom: 14px; }
    .field-label { font-weight: 600; font-size: 13px; text-transform: uppercase; color: #718096; letter-spacing: 0.05em; }
    .field-value { font-size: 16px; margin-top: 4px; color: #1a202c; }
    .message-box { background-color: #f8fafc; border-left: 4px solid #38a169; padding: 14px 18px; border-radius: 4px; font-size: 15px; margin-top: 6px; white-space: pre-wrap; color: #2d3748; line-height: 1.5; }
    .footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid #edf2f7; font-size: 13px; color: #a0aec0; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>New Contact Form Inquiry</h2>

    <div class="field">
      <div class="field-label">Sender Name</div>
      <div class="field-value">{{ name }}</div>
    </div>

    <div class="field">
      <div class="field-label">Sender Email</div>
      <div class="field-value"><a href="mailto:{{ email }}">{{ email }}</a></div>
    </div>

    <div class="field">
      <div class="field-label">Subject</div>
      <div class="field-value">{{ subject }}</div>
    </div>

    <div class="field">
      <div class="field-label">Message Body</div>
      <div class="message-box">{{ message }}</div>
    </div>

    <div class="footer">
      Inquiry received at {{ created_at }} &bull; Website Contact Alert
    </div>
  </div>
</body>
</html>
